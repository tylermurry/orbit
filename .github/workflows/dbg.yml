name: dbg
on: push
jobs:
  t:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: .rr
        run: |
          bin=$(cargo test --no-run 2>&1 | grep -oE 'target/debug/deps/rr-[a-f0-9]+' | head -1); echo bin=$bin
          echo "SHELL=$SHELL"
          set +e
          echo "--- with SHELL"; timeout 60 $bin --nocapture cancel_stops; echo "status=$?"
          echo "--- without SHELL"; env -u SHELL timeout 60 $bin --nocapture cancel_stops; echo "status=$?"
          echo "--- kill syntax"; setsid sleep 30 & sleep 0.3; pg=$(pgrep -n -x sleep); ps -o pid,pgid,cmd -p $pg; /usr/bin/kill -TERM -$pg; echo "kill status=$?"; sleep 0.3; pgrep -x sleep || echo gone
