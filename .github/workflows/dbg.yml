name: dbg
on: push
jobs:
  t:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: .rr
        run: |
          cargo test --no-run 2>/dev/null
          bin=$(ls target/debug/deps/rr-* | grep -v '\.d$' | head -1)
          echo "SHELL=$SHELL"
          set +e
          echo "--- with SHELL"; timeout 60 $bin --nocapture cancel_stops; echo "status=$?"
          echo "--- without SHELL"; env -u SHELL timeout 60 $bin --nocapture cancel_stops; echo "status=$?"
          echo "--- kill syntax"; sleep 30 & p=$!; setsid sleep 30 & sleep 0.3; which kill; kill -TERM -$p; echo "kill status=$?"
